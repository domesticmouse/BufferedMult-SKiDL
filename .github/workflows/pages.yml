name: Deploy Tutorial to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage static tutorial site
        run: |
          mkdir -p _site
          cp tutorial/index.html _site/
          cp tutorial/.nojekyll _site/
          cp -R tutorial/assets _site/assets
          cp -R tutorial/lessons _site/lessons
          cp -R tutorial/reference _site/reference

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        env:
          NODE_OPTIONS: --no-deprecation
